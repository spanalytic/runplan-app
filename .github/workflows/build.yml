name: Build APKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests (plan + run engine)
        run: gradle :core:test --stacktrace

      - name: Build phone and watch APKs
        run: gradle :app:assembleDebug :wear:assembleDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/runplan-phone.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk out/runplan-watch.apk
          printf '{"versionCode": %s, "versionName": "0.1.%s", "sha": "%s"}\n' "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > out/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: runplan-apks
          path: |
            out/*.apk
            out/version.json

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          make_latest: true
          body: "Built from ${{ github.sha }}. Install runplan-phone.apk on your phone and runplan-watch.apk on your watch."
          files: |
            out/*.apk
            out/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write

